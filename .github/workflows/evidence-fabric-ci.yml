name: Evidence Fabric CI

on:
  push:
    branches:
      - hyper-boost
      - 'jules/**'
  pull_request:
    branches:
      - hyper-boost

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover tests/
      - name: Dogfood synthetic fixtures
        run: bash scripts/dogfood.sh
